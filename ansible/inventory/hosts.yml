# Inventario de nodos transaccionales (Paraguay), administrados desde Bolivia.
# Acceso de administración: por la overlay WireGuard (a través del gateway AWS) o,
# en el primer aprovisionamiento, por la LAN de la sede.
all:
  children:
    signing_nodes:
      hosts:
        node-py-01:
          ansible_host: 10.200.0.11        # IP overlay (post-bootstrap). Bootstrap: IP LAN de la sede.
          wg_address: 10.200.0.11
        node-py-02:
          ansible_host: 10.200.0.12
          wg_address: 10.200.0.12
        node-py-03:
          ansible_host: 10.200.0.13
          wg_address: 10.200.0.13
      vars:
        ansible_user: opsadmin
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
