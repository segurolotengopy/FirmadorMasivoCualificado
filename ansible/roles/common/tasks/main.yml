---
- name: Zona horaria actual
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: tz_now
  changed_when: false

- name: Zona horaria
  ansible.builtin.command: timedatectl set-timezone {{ timezone }}
  when: tz_now.stdout | trim != timezone
  changed_when: true

- name: Paquetes base (appliance mínimo)
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - chrony
      - nftables
      - curl
      - jq
      - python3-venv
      - python3-pip
      - build-essential
      - libffi-dev
      - libssl-dev
      - usbutils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Eliminar paquetes innecesarios en un appliance
  ansible.builtin.apt:
    name: [snapd, cloud-init, modemmanager]
    state: absent
    purge: true
  failed_when: false

- name: Actualizaciones de seguridad automáticas (sin reinicio automático; lo decide Bolivia)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins { "${distro_id}:${distro_codename}-security"; };
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Package-Blacklist { "opensc"; "pcscd"; "libccid"; "wireguard"; };

- name: Sincronización horaria activa (crítica para sellos de tiempo y validez de firmas)
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true

- name: Grupo y usuario de servicio (sin shell, sin home interactivo)
  block:
    - name: Grupo de servicio
      ansible.builtin.group:
        name: "{{ firma_group }}"
        system: true
    - name: Usuario de servicio
      ansible.builtin.user:
        name: "{{ firma_user }}"
        group: "{{ firma_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ firma_home }}"
        create_home: false

- name: Deshabilitar suspensión/hibernación (appliance 24x7)
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop: [sleep.target, suspend.target, hibernate.target, hybrid-sleep.target]

- name: Endurecimiento SSH mínimo
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.key }} "
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - { key: PasswordAuthentication, value: "no" }
    - { key: PermitRootLogin, value: "no" }
    - { key: X11Forwarding, value: "no" }
  notify: reiniciar sshd
